<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a4bb0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench Stats">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
</style>
<script>window.BENCH_PWA = true; window.BENCH_VERSION = '0.9.0';</script>
<title>Bench Live Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: split-screen bench console. Own club left, rival right; each half = header (TO + sanctions), info stack (GKs, shot maps, possession timeline) above a large tap pad. */
:root{
  --bg:#e8edf4; --card:#ffffff; --card2:#f4f7fb; --line:#d5deea; --fg:#0e1a2b; --muted:#5a6a80;
  --brand:#0a4bb0; --pos:#4c45e0; --fb:#0b8f63; --red:#d01f3a; --blue:#1c58cf; --neutral:#0e1a2b;
  --yc:#e7b416; --yc-ink:#8a6400; --rc:#d01f3a; --save:#0b8f63; --other:#9aa7b8; --sf:#e08a00; --scrim:rgba(14,26,43,.45);
  --shadow:0 1px 2px rgba(14,26,43,.06),0 3px 10px rgba(14,26,43,.06);
  --f-disp:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b111d; --card:#141c2c; --card2:#1a2335; --line:#28344b; --fg:#e5ebf4; --muted:#93a1b7;
  --brand:#5b9bff; --pos:#8d87ff; --fb:#33d19a; --red:#ff5a6e; --blue:#6aa2ff; --neutral:#e5ebf4;
  --yc:#f1c232; --yc-ink:#f1c232; --rc:#ff5a6e; --save:#33d19a; --other:#5f6c82; --sf:#ffb340; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111d; --card:#141c2c; --card2:#1a2335; --line:#28344b; --fg:#e5ebf4; --muted:#93a1b7;
  --brand:#5b9bff; --pos:#8d87ff; --fb:#33d19a; --red:#ff5a6e; --blue:#6aa2ff; --neutral:#e5ebf4;
  --yc:#f1c232; --yc-ink:#f1c232; --rc:#ff5a6e; --save:#33d19a; --other:#5f6c82; --sf:#ffb340; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--line);min-height:52px;flex-wrap:wrap}
.tb{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.tb:active{transform:translateY(1px)}
.tb.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tb[disabled]{opacity:.4;cursor:default}
.code{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.code b{color:var(--fg)}
.scorewrap{margin:0 auto;display:flex;align-items:center;gap:8px}
.score{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;border:0;background:transparent;padding:2px 4px;border-radius:8px;position:relative}
.score[disabled]{cursor:default}
.score .ab{font-size:15px;letter-spacing:.06em;color:var(--muted)}
.score .sc{font-family:var(--f-num);font-size:30px;line-height:1;min-width:2ch;text-align:center;border:2px solid var(--red);border-radius:6px;padding:3px 6px;color:var(--fg)}
.score .adj{position:absolute;top:-3px;right:-6px;font-size:10px;font-weight:700;color:var(--card);background:var(--red);border-radius:6px;padding:1px 4px;font-family:var(--f-body)}
.tmr{border:1px solid var(--line);background:var(--card2);border-radius:20px;min-height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px;color:var(--muted)}
.tmr svg{width:18px;height:18px;flex:none}
.tmr.on{background:var(--fg);color:var(--card);border-color:var(--fg);padding:4px 12px}
.tmr.on span{font-family:var(--f-num);font-weight:700;font-size:16px}
.tmr[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card2);padding:8px 12px;font-weight:600;font-size:13px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--card)}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.badge.live{color:var(--red);border-color:var(--red)}
.badge.view{color:#1b1400;background:var(--sf);border-color:var(--sf)}
.seg button.viewing[aria-pressed="true"]{background:var(--sf);color:#1b1400}
.console.viewing .panel{box-shadow:0 0 0 2px var(--sf)}

/* console */
.console{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.half{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px;min-height:0;overflow-y:auto;overflow-x:hidden}
.half+.half{border-left:2px solid var(--red)}
.thead{display:flex;align-items:center;gap:10px;min-height:38px}
.half.R .thead{flex-direction:row-reverse}
.tname{font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;text-align:center;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tos{display:flex;gap:5px;align-items:center;flex:none}
.tos .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 2px}
.tobox{width:30px;height:30px;border:2px solid var(--fg);border-radius:4px;background:transparent;padding:0}
.tobox.used{background:var(--fg)}
.tobox[disabled]{cursor:default}
.sanc{flex:0 1 auto;max-width:42%;min-width:96px;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:3px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:3px 5px;min-height:34px;background:transparent}
.half.L .sanc{direction:rtl}
.half.L .sanc > *{direction:ltr}
.sanc[aria-expanded="true"]{border-style:solid;border-color:var(--fg)}
.sanc .none{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:0 4px}
.scc{width:25px;height:25px;border-radius:50%;border:2.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:11px;font-weight:700;flex:none;color:var(--fg)}
.scc.yc{border-color:var(--yc)} .scc.two{border-color:var(--blue)} .scc.rc{border-color:var(--rc)} .scc.third{color:var(--red)}
.o3{font-family:var(--f-num);font-size:11px;font-weight:700;border:1.5px solid var(--fb);color:var(--fb);border-radius:12px;padding:3px 7px;flex:none}
.o3.ok{background:var(--fb);color:var(--card)}
.sanc-pop{position:absolute;top:48px;left:10px;right:10px;z-index:6;background:var(--card);border:2px solid var(--fg);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:60%;display:flex;flex-direction:column;overflow:hidden}
.sp-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card2)}
.sp-h b{flex:1;font-family:var(--f-disp);font-size:16px;letter-spacing:.03em}
.sp-b{overflow:auto;padding:4px 10px 8px}
.sp-r{display:grid;grid-template-columns:30px minmax(0,1.6fr) .9fr .8fr minmax(0,1.6fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.sp-r:last-child{border-bottom:0}
.sp-r .ty{font-weight:700}
.sp-r .tm{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.sp-r .pv{color:var(--muted)}
.o3d{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 9px 38px;border-bottom:1px solid var(--line)}
.o3d .at{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--card2)}
.o3d .at b{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.o3d .mk2{font-family:var(--f-num);font-weight:700;font-size:14px}
.o3d .mk2 sub{font-size:9px}
.o3d .mk2.pos{color:var(--red)} .o3d .mk2.neg{color:var(--blue)} .o3d .mk2.neu{color:var(--neutral)}
.o3d .open{font-size:11px;color:var(--muted);font-style:italic}

.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.sec-l{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* goalkeepers */
.gks{display:flex;flex-direction:column;gap:4px}
.gkrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 8px;min-height:32px}
.gkrow.active{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.gkrow.gkpad{visibility:hidden;box-sizing:border-box}
.gknum{font-family:var(--f-num);font-weight:700;font-size:15px;min-width:2.2ch}
.gkline{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.seq{flex:1;display:flex;gap:2px;overflow:hidden;min-width:0}
.g7{display:flex;align-items:center;gap:2px;border-left:2px solid var(--fg);padding-left:6px;min-width:96px}
.g7 .sec-l{margin-right:3px}
.mk{width:9px;height:14px;border-radius:2px;flex:none;background:var(--other)}
.mk.s{background:var(--save)} .mk.g{background:var(--red)} .mk.p7{background:var(--save);box-shadow:inset 0 0 0 2px var(--card)}
.mk.sf{background:transparent;box-shadow:inset 0 0 0 2px var(--sf)}
.gkpct{font-family:var(--f-num);font-size:12px;color:var(--muted);min-width:58px;text-align:right;line-height:1.2}
.gkpct .sfc{color:var(--sf);font-size:10px}
.gkact{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--brand);text-transform:uppercase;min-width:44px;text-align:right}
.gkpct.r{min-width:auto;padding-right:2px}

/* maps */
.maps{display:grid;grid-template-columns:1.45fr 1fr;gap:8px}
.court{position:relative;padding:6px}
.court svg.bg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);pointer-events:none}
.zgrid{position:relative;display:grid;grid-template-columns:.85fr 1fr 1fr 1fr .85fr;grid-template-rows:repeat(4,minmax(32px,auto));gap:3px;grid-template-areas:"lw pnl pnc pnr rw" "lw pvl pvc pvr rw" "z69l z69l z69c z69r z69r" "z9l z9l z9c z9r z9r"}
.zabs{position:relative;height:100%;min-height:178px}
.za{position:absolute;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;max-width:26%;line-height:1.15}
.zoom .zabs{min-height:520px}
.zc{border:1px dashed var(--line);border-radius:5px;padding:2px 3px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:1px 3px;background:color-mix(in srgb,var(--card) 70%,transparent);min-width:0;position:relative}
.zc .zl{display:none}
.court .zc{border:0;background:transparent}
.chip{font-family:var(--f-num);font-size:11px;font-weight:700;line-height:1.25}
.chip.g{color:var(--red)} .chip.n{color:var(--blue)} .chip.k{color:var(--fg)}
.fbmap{padding:6px;display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:3px;align-content:start}
.fbmap .rl{font-family:var(--f-disp);font-weight:700;font-size:12px;display:flex;align-items:center;color:var(--muted)}
.fbmap .zc{min-height:22px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.fbmap .hd{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);padding-bottom:3px}

/* chronogram */
.chrono{display:flex;padding:4px 0 4px 4px}
.ch-labels{display:grid;grid-template-rows:15px repeat(5,21px);flex:none}
.ch-labels span{font-family:var(--f-disp);font-weight:700;font-size:11px;color:var(--muted);padding-right:6px;display:flex;align-items:center}
.ch-scroll{overflow-x:auto;flex:1;min-width:0}
.ch-grid{display:grid;grid-auto-flow:column;grid-template-rows:15px repeat(5,21px);grid-auto-columns:max-content}
.ch-grid > div{border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:11px;font-weight:700;white-space:nowrap;padding:0 2px;min-width:24px}
.ch-grid > div.tom{min-width:5px;width:5px;padding:0;background:var(--mc);border:0}
.ch-grid > div.plm{min-width:0;padding:0 2px;border-left:2px dashed var(--mc);color:var(--mc);font-size:9px}
.pv{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.ch-grid .hn{font-size:9px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.ch-grid .h2{border-left:2px solid var(--fg)}
.ch-grid .pos{color:var(--red)} .ch-grid .neg{color:var(--blue)} .ch-grid .neu{color:var(--neutral)}
.ch-grid sub{font-size:7.5px;vertical-align:baseline;margin-left:1px;position:relative;top:3px}
.ch-empty{font-size:12px;color:var(--muted);padding:8px}

/* tap pad */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pb{border:2px solid var(--fg);background:var(--card);border-radius:9px;font-family:var(--f-disp);font-weight:700;letter-spacing:.03em;display:flex;align-items:center;justify-content:center}
.pb:active{transform:translateY(1px);background:var(--card2)}
.pb[disabled]{opacity:.35;cursor:default}
.pb.big{min-height:50px;font-size:24px;border-color:var(--pos);color:var(--pos)}
.pb.fb{min-height:40px;font-size:17px;border-color:var(--fb);color:var(--fb)}
.pb.ag{min-height:40px;font-size:17px;border-color:var(--fb);color:var(--fb);border-style:dashed}
.extras{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.extras.n5{grid-template-columns:repeat(5,1fr)}
.pb.plb{font-size:15px}
.fl-top{display:flex;align-items:center;gap:10px}
.fl-top .fl-q{flex:1}
.psvt{border:2px dashed var(--sf);background:var(--card);color:var(--sf);border-radius:9px;min-height:44px;padding:4px 16px;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.04em}
.psvt.on{background:var(--sf);border-style:solid;color:#1b1400}
.pb.x{min-height:42px;font-size:17px}
.pb.yc{border-color:var(--yc);color:var(--yc-ink);border-width:3px}
.pb.rcard{border-color:var(--rc);color:var(--rc);border-width:3px}
.pb small{font-size:11px;font-weight:600;margin-left:3px;opacity:.8}

/* flow sheet */
.flow{position:absolute;inset:46px 6px 6px 6px;background:var(--card);border:2px solid var(--fg);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:7;overflow:hidden}
.fl-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card2)}
.crumbs{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.crumb{font-family:var(--f-disp);font-weight:700;font-size:15px;padding:3px 8px;border-radius:5px;background:var(--card);border:1px solid var(--line)}
.crumb.now{background:var(--fg);color:var(--card);border-color:var(--fg)}
.fl-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.fl-q{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.02em}
.opts{display:grid;gap:7px}
.o{border:2px solid var(--line);background:var(--card);border-radius:9px;min-height:54px;font-family:var(--f-disp);font-weight:700;font-size:19px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.o:active{background:var(--card2)}
.o small{font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o.g{border-color:var(--red);color:var(--red)}
.o.n{border-color:var(--blue);color:var(--blue)}
.o.n.hl{background:color-mix(in srgb,var(--blue) 16%,var(--card));border-width:3px}
.o.t{border-color:var(--muted)}
.o.sfb{border-color:var(--sf);color:var(--sf)}
.o.u{border-style:dashed;color:var(--muted)}
.o.gk{background:var(--card2)}
.opts.res{grid-template-columns:repeat(5,1fr)}
.opts.turn{grid-template-columns:repeat(5,1fr)}
.opts.turn .o{min-height:46px;font-size:17px}
.opts.pl{grid-template-columns:repeat(5,1fr)}
.opts.pl .o{min-height:58px;font-size:24px}
.opts.min{grid-template-columns:repeat(8,1fr)}
.opts.min .o,.opts.sec .o{min-height:44px;font-size:17px;font-family:var(--f-num)}
.opts.sec{grid-template-columns:repeat(10,1fr)}
.opts.fbz{grid-template-columns:repeat(3,1fr)}
.opts.fbz .o{min-height:64px}
.grp-l{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:-3px}
.zpick{grid-template-rows:repeat(4,58px)}
.zpick .o{font-size:15px;min-height:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--card);padding:10px 12px 10px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-weight:500}
.toast button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:6px 10px;font-weight:700}

/* modal + overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(900px,100%)}
.modal.xwide{width:min(1240px,100%)}
/* zoomed views */
.zoom .court{padding:10px} .zoom .court svg.bg{inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.zoom .zgrid{grid-template-rows:repeat(4,minmax(96px,auto));gap:6px}
.zoom .chip{font-size:22px;line-height:1.3}
.zoom .zc{gap:2px 10px;padding:6px}
.zoom .fbmap{grid-template-columns:70px 1fr 1fr 1fr;gap:6px;padding:10px}
.zoom .fbmap .zc{min-height:62px}
.zoom .fbmap .rl{font-size:20px}
.zoom .fbmap .hd{font-size:13px}
.zoom .chrono{padding:8px 0 8px 8px}
.zoom .ch-labels,.zoom .ch-grid{grid-template-rows:26px repeat(5,44px)}
.zoom .ch-labels span{font-size:17px;padding-right:10px}
.zoom .ch-grid > div{font-size:18px;padding:0 6px;min-width:44px}
.zoom .ch-grid > div.tom{min-width:8px;width:8px}
.zoom .ch-grid > div.plm{min-width:0;font-size:13px}

<body>
<div id="app"></div>
<div id="toast-host"></div>
<div id="modal-host"></div>
<div id="print-host" aria-hidden="true"></div>

<script>
/* ===================== constants ===================== */
const KEY = 'benchlive.v2';
const BREAK_MS = 15*60*1000;
const POS_PH = ['6x6','7x6','+1','-1'];
const FB_PH  = ['FB1w','FBfl','FB2w','FB3w'];
const AG_PH  = ['AG1w','AGfl','AG2w','AG3w'];
const ALL_PH = [...POS_PH, ...FB_PH, ...AG_PH];
const PH_LABEL = {'6x6':'6x6','7x6':'7x6','+1':'+1','-1':'-1',FB1w:'FB 1w',FBfl:'FB Flash',FB2w:'FB 2w',FB3w:'FB 3w',AG1w:'AG 1w',AGfl:'AG Flash',AG2w:'AG 2w',AG3w:'AG 3w'};
const isTrans = ph => !!ph && (ph.startsWith('FB') || ph.startsWith('AG'));
const SHOT = ['GOAL','SAVE','POST','OUT','BLOCK'];
const TURN = ['PS','PV','W','RC','AF','ST','L','DB','PAS','MB'];
const FOULS = ['FOUL','SFOUL'];
const RES_LABEL = {GOAL:'Goal',SAVE:'Save',POST:'Post',OUT:'Out',BLOCK:'Block','7M':'7m','2MIN':"2'",FOUL:'Foul',SFOUL:'Save in foul',STOPFB:'Stop FB',MB7M:'MB7m'};
const POSITIVE = new Set(['GOAL','7M','2MIN']);
const NEUTRAL  = new Set(['FOUL','SFOUL','STOPFB']);
// a possession always closes on these; fouls close it only in transition (in positional the same team keeps the ball)
const isDefinite = e => ['7M','2MIN','STOPFB'].includes(e.res) || (isTrans(e.phase) && FOULS.includes(e.res));
const POS_ZONES = [
  ['lw','LW','Left wing'],['rw','RW','Right wing'],
  ['pnl','PNL','Penetr. L'],['pnc','PNC','Penetr. C'],['pnr','PNR','Penetr. R'],
  ['pvl','PVL','Pivot L'],['pvc','PVC','Pivot C'],['pvr','PVR','Pivot R'],
  ['z69l','69L','6-9m L'],['z69c','69C','6-9m C'],['z69r','69R','6-9m R'],
  ['z9l','9L','9m L'],['z9c','9C','9m C'],['z9r','9R','9m R']];
const ZONE_LABEL = Object.fromEntries(POS_ZONES.map(z=>[z[1],z[2]]));
// where each zone sits on the drawn court (% of width, % of height): 6m line peaks at 30%, 9m line at 58%
const ZONE_XY = {LW:[7,9], RW:[93,9], PNL:[25,13], PNC:[50,17], PNR:[75,13], PVL:[28,31], PVC:[50,36], PVR:[72,31],
  '69L':[19,40], '69C':[50,50], '69R':[81,40], '9L':[17,66], '9C':[50,72], '9R':[83,66]};
Object.assign(ZONE_LABEL,{L:'Left',C:'Centre',R:'Right',CCL:'C/C L',CCC:'C/C C',CCR:'C/C R'});
const isCC = z => !!z && z.startsWith('CC');
const statsPhase = e => isCC(e.zone) ? 'FB1w' : e.phase;   // C/C counts as FB1w in stats
const KIND_LABEL = {poss:'Possession',p7:'7m shot',pen2:"2'",foul:'Foul',yc:'Yellow card',rc:'Red card',out3:'Player out (3 attacks)',to:'Time-out',pl:'Playmaker change'};
const MONTHS = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const STOPWATCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="14" r="7.5"/><path d="M12 14V10.5M10 2.5h4M12 2.5v4M18.5 6.5l1.5-1.5"/></svg>';

/* ===================== storage ===================== */
let DB;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two = n => String(n).padStart(2,'0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; };
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); if(o && o.teams && o.matches) return migrate(o); } }catch(e){}
  try{ // data from prototype v0.1: keep it unless it only holds the old demo
    const r = localStorage.getItem('benchlive.v1'); if(r){ const o = JSON.parse(r);
      const onlyDemo = o.matches.every(m=>m.demo) && o.teams.every(t=>t.demo || t.id==='t_wisla');
      if(!onlyDemo) return migrate(o); } }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function migrate(o){
  o.settings = o.settings || {theme:'light'};
  o.teams.forEach(t=>{ const seen = new Set(t.players.map(p=>p.id).filter(Boolean));
    t.players.forEach(p=>{ if(!p.id){ let id = 'n'+p.num; while(seen.has(id)) id += 'b'; p.id = id; seen.add(id); } if(p.active===undefined) p.active = true; }); });
  const fix = v => typeof v==='number' ? 'n'+v : v;
  o.matches.forEach(m=>{
    if(!m.date) m.date = new Date(m.created||Date.now()).toISOString().slice(0,10);
    if(!m.scoreAdj) m.scoreAdj = {L:0,R:0};
    if(m.breakEnd===undefined) m.breakEnd = null;
    m.activeGk = {L:fix(m.activeGk?.L ?? null), R:fix(m.activeGk?.R ?? null)};
    m.events.forEach(e=>{ ['p','opp','gk'].forEach(k=>{ if(e[k]!==undefined) e[k] = fix(e[k]); }); });
  });
  return o;
}

const UI = { viewHalf:null, view:'match', matchId:null, flow:null, analysis:false, aHalf:'T', aTab:'team', modal:null, toastTimer:null, sanc:null };

/* ===================== helpers ===================== */
const team = id => DB.teams.find(t=>t.id===id);
const match = () => DB.matches.find(m=>m.id===UI.matchId);
const other = s => s==='L' ? 'R' : 'L';
const sideTeam = (m,s) => team(s==='L' ? m.leftId : m.rightId) || {name:'?',abbr:'?',color:'#888',players:[]};
const byNum = (a,b) => a.num-b.num || a.name.localeCompare(b.name);
const roster = (m,s) => { const out = new Set(m?.out?.[s] || []); return sideTeam(m,s).players.filter(p=>p.active!==false && !out.has(p.id)).sort(byNum); };
const fullRoster = (m,s) => sideTeam(m,s).players.filter(p=>p.active!==false).sort(byNum);
const gkList = (m,s) => roster(m,s).filter(p=>p.gk);
const player = (m,s,id) => sideTeam(m,s).players.find(p=>p.id===id);
const dn = (m,s,id) => { if(id==null||id==='?') return '?'; const p = player(m,s,id); return p ? String(p.num) : '?'; };
const pName = (m,s,id) => { if(id==null||id==='?') return 'Unknown'; const p = player(m,s,id); return p ? `#${p.num} ${p.name}` : 'Unknown'; };
const ro = m => m.status !== 'live';
const vh = m => UI.viewHalf ?? m.half;   // half shown on the bench (maps, timeline, goalkeepers)
const fullCode = m => (m.date ? m.date+' ' : '') + m.code;
const ownTeam = () => DB.teams.find(t=>t.own);
const tmStr = e => e.min!=null ? `${two(e.min)}:${two(e.sec??0)}` : '';

function describe(m,e){
  const pn = n => pName(m,e.side,n), on = n => pName(m,other(e.side),n);
  const t = () => e.min!=null ? ` · ${tmStr(e)}` : '';
  switch(e.kind){
    case 'poss': {
      let s = `${PH_LABEL[e.phase]} · ${RES_LABEL[e.res]||e.res}`;
      if(SHOT.includes(e.res)) s += ` · ${pn(e.p)} · ${ZONE_LABEL[e.zone]||'–'}`;
      else if(TURN.includes(e.res)) s += ` · ${pn(e.p)}` + (e.rec ? (e.rec==='none' ? ' · no one' : ` · won by ${on(e.rec)}`) : '');
      else if(e.res==='7M') s += ` · prov. ${pn(e.p)} · comm. ${on(e.opp)}`+(e.zone?` · ${ZONE_LABEL[e.zone]}`:'');
      else if(e.res==='2MIN') s += ` · prov. ${pn(e.p)} · sanct. ${on(e.opp)}`+t();
      else if(e.res==='FOUL') s += ` · by ${on(e.opp)}`;
      else if(e.res==='SFOUL') s += ` · by ${on(e.opp)} · GK ${on(e.gk)}`;
      return s; }
    case 'p7': return `7m · ${RES_LABEL[e.res]} · ${pn(e.p)}` + (e.reb==='7M' ? ` · rebound: 7m prov. ${pn(e.rebP)} · comm. ${on(e.rebOpp)}` : e.reb ? ` · rebound ${RES_LABEL[e.reb]}` : '');
    case 'pen2': return `2' · ${pn(e.p)} · prov. ${on(e.opp)}`+t();
    case 'foul': return `Foul · ${pn(e.p)}`;
    case 'yc': return `Yellow card · ${pn(e.p)}`+t();
    case 'rc': return `Red card · ${pn(e.p)}`+t();

}

/* ===================== stats engine ===================== */
// A possession event is "continued" (not counted on its own) when the next possession event in the same half
// belongs to the same team and it did not end in a definite result. Time-outs, cards, 2' buttons etc. are ignored.
function finals(m){
  const ps = m.events.filter(e=>e.kind==='poss');
  const out = [];
  ps.forEach((e,i)=>{ const n = ps[i+1];
    const cont = n && n.side===e.side && n.half===e.half && !isDefinite(e);
    if(!cont) out.push(e); });
  return out;
}
function computeStats(m, half){
  const inH = e => half==='T' || e.half===Number(half);
  const ev = m.events.filter(inH);
  const fin = finals(m).filter(inH);
  const S = {};
  for(const s of ['L','R']){
    const o = other(s);
    const ph = {}; ALL_PH.forEach(p=>ph[p]={pos:0,good:0,mb:0});
    fin.filter(e=>e.side===s && !(isTrans(e.phase) && NEUTRAL.has(e.res))).forEach(e=>{ const p = ph[statsPhase(e)]; if(!p) return; p.pos++; if(POSITIVE.has(e.res)) p.good++; });
    ev.filter(e=>e.kind==='poss' && e.side===s && TURN.includes(e.res)).forEach(e=>{ ph[e.phase].mb++; });
    const sum = list => list.reduce((a,k)=>({pos:a.pos+ph[k].pos,good:a.good+ph[k].good,mb:a.mb+ph[k].mb}),{pos:0,good:0,mb:0});
    const shots = ev.filter(e=>e.kind==='poss' && e.side===s && SHOT.includes(e.res));
    const p7 = ev.filter(e=>e.kind==='p7' && e.side===s && e.res!=='MB7M');
    const rebs = p7.filter(e=>SHOT.includes(e.reb));
    const goals = shots.filter(e=>e.res==='GOAL').length + p7.filter(e=>e.res==='GOAL').length + rebs.filter(e=>e.reb==='GOAL').length;
    const twoMin = ev.filter(e=>e.kind==='pen2' && e.side===s).length + ev.filter(e=>e.kind==='poss' && e.side===o && e.res==='2MIN').length;
    const fouls = ev.filter(e=>e.kind==='foul' && e.side===s).length + ev.filter(e=>e.kind==='poss' && e.side===o && FOULS.includes(e.res)).length;
    let sv=0, gl=0;
    ev.filter(e=>e.kind==='poss' && e.side===o && SHOT.includes(e.res) && !isCC(e.zone)).forEach(e=>{ if(e.res==='SAVE') sv++; if(e.res==='GOAL') gl++; });
    ev.filter(e=>e.kind==='p7' && e.side===o).forEach(e=>{ if(e.res==='SAVE'||e.res==='POST') sv++; if(e.res==='GOAL') gl++; if(e.reb==='SAVE') sv++; if(e.reb==='GOAL') gl++; });
    S[s] = { ph, positional:sum(POS_PH), transition:sum([...FB_PH,...AG_PH]), total:sum(ALL_PH), goals,
      shots:{g:shots.filter(e=>e.res==='GOAL').length + rebs.filter(e=>e.reb==='GOAL').length, n:shots.length + rebs.length},
      m7:{g:p7.filter(e=>e.res==='GOAL').length, n:p7.length},
      mb: ev.filter(e=>e.kind==='poss' && e.side===s && TURN.includes(e.res)).length,
      twoMin, fouls, gk:{s:sv, n:sv+gl} };
  }
  return S;
}
const rawScore = m => { const S = computeStats(m,'T'); return {L:S.L.goals, R:S.R.goals}; };
const score = m => { const r = rawScore(m), a = m.scoreAdj||{L:0,R:0}; return {L:r.L+a.L, R:r.R+a.R}; };
const pct = (a,b) => b ? (100*a/b).toFixed(1)+'%' : '–';

// sanctions received by side s, in chronological order
function sanctions(m,s){
  const o = other(s), out = [];
  m.events.forEach(e=>{
    if((e.kind==='yc'||e.kind==='rc') && e.side===s) out.push({type:e.kind, pid:e.p, e, prov:null});
    else if(e.kind==='pen2' && e.side===s) out.push({type:'two', pid:e.p, e, prov:e.opp});
    else if(e.kind==='poss' && e.side===o && e.res==='2MIN') out.push({type:'two', pid:e.opp, e, prov:e.p});
  });
  const twos = {};
  out.forEach(x=>{ if(x.type==='two' && x.pid && x.pid!=='?'){ twos[x.pid] = (twos[x.pid]||0)+1; if(twos[x.pid]===3) x.third = true; } });
  return out;
}
// players out for treatment (3 attacks) on side s, with attacks completed since
// An attack runs from the moment a team gains the ball until the other team has it.
// Stop FB, fouls, 2' and 7m do not end it; it ends when the rival registers a possession or the half changes.
function attacks(m){
  const out = [];
  m.events.forEach((e,i)=>{ if(e.kind!=='poss') return;
    const a = out[out.length-1];
    if(a && a.side===e.side && a.half===e.half) a.last = i;
    else out.push({side:e.side, half:e.half, first:i, last:i}); });
  out.forEach((a,k)=>{
    const nextFirst = k < out.length-1 ? out[k+1].first : m.events.length;
    a.end = a.last;   // the 7m throw belongs to the attack that provoked it
    for(let i=a.last+1;i<nextFirst;i++){ const e = m.events[i]; if(e.kind==='p7' && e.side===a.side) a.end = i; }
    const le = m.events[a.end];
    const lost = (le.kind==='poss' && (le.res==='GOAL' || le.res==='OUT' || TURN.includes(le.res))) || (le.kind==='p7' && ['GOAL','SAVE','OUT','MB7M'].includes(le.reb || le.res));
    a.complete = k < out.length-1 || a.half < m.half || lost;
  });
  return out;
}
// players out for treatment: completed attacks of their team whose last action came after the player went out
function outs(m,s){
  const ats = attacks(m).filter(a=>a.side===s);
  return m.events.map((e,i)=>({e,i})).filter(x=>x.e.kind==='out3' && x.e.side===s)
    .map(x=>{ const after = ats.filter(a=>a.end>x.i); return {e:x.e, n:after.filter(a=>a.complete).length, list:after.slice(0,3)}; });
}
// marks used in the possession timeline and in the player-out detail
const markCls = e => POSITIVE.has(e.res) ? 'pos' : NEUTRAL.has(e.res) ? 'neu' : 'neg';
function markTxt(m,s,e){ const own = esc(dn(m,s,e.p)), opp = esc(dn(m,other(s),e.opp));
  if(SHOT.includes(e.res)) return e.passive ? `<span class="pv">${own}</span>` : own;
  if(TURN.includes(e.res)) return `${e.res}<sub>${own}</sub>`;
  if(e.res==='7M') return `7m<sub>${own}</sub>`;
  if(e.res==='2MIN') return `2'<sub>${own}</sub>`;
  if(e.res==='FOUL') return `F<sub>${opp}</sub>`;
  if(e.res==='SFOUL') return `SF<sub>${opp}</sub>`;
  return 'SFB'; }

      else { g += `<div class="plm hn" style="--mc:${esc(col)}" title="${esc(describe(m,e))}">⇄${esc(dn(m,s,e.p))}</div>` + rows.map(()=>`<div class="plm" style="--mc:${esc(col)}"></div>`).join(''); }
      return; }
    const c = it.col; n++;
    g += `<div class="hn">${n}</div>` + rows.map(r=>{

/* ===================== flows ===================== */
const P = (who,key,label) => ({t:'p',who,key,label});
const TIME = [{t:'min'},{t:'sec'}];
function baseSteps(kind){
  switch(kind){
    case 'poss': return [{t:'res'}];
    case 'p7':   return [{t:'p7res'}, P('own','p','Shooter')];
    case 'pen2': return [P('own','p',"Player sanctioned (2')"), P('opp','opp',"2' provoked by"), ...TIME];
    case 'foul': return [P('own','p','Foul committed by')];
    case 'yc':   return [P('own','p','Yellow card to'), ...TIME];
    case 'rc':   return [P('own','p','Red card to'), ...TIME];
    case 'out3': return [P('own','p','Player out (3 attacks)')];
    case 'to':   return [...TIME];
    case 'pl':   return [P('own','p','New playmaker')];
  }
}
function afterRes(res, phase){
  if(SHOT.includes(res)) return [P('own','p','Shooter'), {t:'zone'}];
  if(TURN.includes(res)) return [P('own','p','Turnover by'), P('opp','rec','Ball won by')];
  if(res==='7M')   return [P('own','p','7m provoked by'), P('opp','opp','7m committed by'), ...(isTrans(phase)?[]:[{t:'zone'}])];
  if(res==='2MIN') return [P('own','p',"2' provoked by"), P('opp','opp',"Player sanctioned (2')"), ...TIME];
  if(FOULS.includes(res)) return [P('opp','opp','Foul committed by')];
  return [];
}
function startFlow(side,kind,init={}){ UI.sanc = null; UI.flow = {side,kind,d:{...init},steps:baseSteps(kind),i:0}; wake(); render(); }
function choose(v){
  const f = UI.flow, st = f.steps[f.i];
  if(st.t==='res'){ f.d.res = v; f.steps = [st, ...afterRes(v, f.d.phase)]; }
  else if(st.t==='p7res'){ f.d.res = v; f.steps = [st, P('own','p','Shooter'), ...(v==='SAVE'||v==='POST' ? [{t:'reb'}] : [])]; }
  else if(st.t==='reb'){ if(v!=='NONE') f.d.reb = v; if(v==='7M') f.steps = [...f.steps.slice(0, f.i+1), P('own','rebP','7m provoked by'), P('opp','rebOpp','7m committed by')]; }
  else if(st.t==='p') f.d[st.key] = v;
  else if(st.t==='zone') f.d.zone = v;
  else if(st.t==='min') f.d.min = Number(v);
  else if(st.t==='sec') f.d.sec = Number(v);
  f.i++;
  if(f.i >= f.steps.length) commit(); else render();
}
function commit(){
  const m = match(), f = UI.flow, o = other(f.side);
  const before = ['L','R'].flatMap(s=>outs(m,s).map(x=>[x.e.id,x.n]));
  const e = {id:uid(), kind:f.kind, side:f.side, half:m.half, ...f.d};
  if(e.kind==='poss'){
    if(!SHOT.includes(e.res) && !(e.res==='7M' && !isTrans(e.phase))) delete e.zone;
    if((SHOT.includes(e.res) && !isCC(e.zone)) || e.res==='SFOUL') e.gk = m.activeGk[o] ?? null;
    if(SHOT.includes(e.res) && m.passive?.[f.side]) e.passive = true;
    // passive warning: kept after a foul (same attack goes on), switched off with any other ending
    if(m.passive?.[f.side] && !FOULS.includes(e.res)) m.passive[f.side] = false;
    if(m.passive?.[o]) m.passive[o] = false; }   // the rival has the ball: its passive warning is over
  if(e.kind==='p7') e.gk = m.activeGk[o] ?? null;
  m.events.push(e); UI.flow = null; save(); render();
  const prev = Object.fromEntries(before);
  const back = ['L','R'].flatMap(s=>outs(m,s).filter(x=>x.n===3 && prev[x.e.id]===2).map(x=>`${sideTeam(m,s).abbr} ${pName(m,s,x.e.p)} can return to court`));
  toast(back.length ? '✚ '+back.join(' · ') : `${sideTeam(m,e.side).abbr} · ${describe(m,e)}`, true);
}
function stepLabel(f,st){
  const d = f.d, m = match();
  if(st.t==='res'||st.t==='p7res') return d.res ? (RES_LABEL[d.res]||d.res) : null;
  if(st.t==='p'){ const v = d[st.key]; if(v===undefined) return null; if(v==='none') return 'No one'; return v==='?' ? '?' : '#'+dn(m, st.who==='own'?f.side:other(f.side), v); }
  if(st.t==='zone') return d.zone ? ZONE_LABEL[d.zone] : null;
  if(st.t==='reb') return d.reb ? (d.reb==='7M' ? 'Rebound · 7m' : 'Rebound '+RES_LABEL[d.reb]) : 'No rebound';
  if(st.t==='min') return d.min!=null ? two(d.min)+"'" : null;
  if(st.t==='sec') return d.sec!=null ? two(d.sec)+'"' : null;
}

      <div class="grp-l">Fouls</div><div class="opts res">${opt('FOUL','Foul','t')}${opt('SFOUL','Save in foul','sfb','GK save, not counted')}${isTrans(f.d.phase)?opt('STOPFB','Stop FB','t','neutral'):''}</div>
      <div class="grp-l">Turnover</div><div class="opts turn">${TURN.map(r=>opt(r,r,'n'+(r==='PV'||r==='AF'?' hl':''), r==='MB'?'others':'')).join('')}</div>`;

  } else if(st.t==='zone'){
    q = 'Shot zone';
    if(isTrans(f.d.phase)){
      body = `<div class="opts fbz">${['L','C','R'].map(z=>opt(z,ZONE_LABEL[z])).join('')}</div>

  return `<div class="flow" role="dialog" aria-label="Register action">
    <div class="fl-head"><button class="mini" data-act="flow-back">← Back</button><div class="crumbs">${crumbs}</div><button class="mini danger" data-act="flow-cancel">✕ Cancel</button></div>
    <div class="fl-body"><div class="fl-top"><div class="fl-q">${q}</div>${f.kind==='poss' && st.t==='res' ? `<button class="psvt ${m.passive?.[s]?'on':''}" data-act="flow-passive" aria-pressed="${!!m.passive?.[s]}">PASSIVE${m.passive?.[s]?' · ON':''}</button>` : ''}</div>${body}</div></div>`;

function teamHTML(m){

/* ---------- players tab ---------- */
function computePlayers(m, half, s){
  const o = other(s), inH = e => half==='T' || e.half===Number(half), rows = {};
  const get = id => rows[id ?? '?'] ??= {sh:{g:0,n:0}, m7:{g:0,n:0}, p2:0, p7:0, mb:0, r2:0, r7:0, rb:0, fc:0};
  m.events.filter(inH).forEach(e=>{
    if(e.kind==='poss' && e.side===s){
      if(SHOT.includes(e.res)){ const r = get(e.p); r.sh.n++; if(e.res==='GOAL') r.sh.g++; }
      else if(TURN.includes(e.res)) get(e.p).mb++;
      else if(e.res==='7M') get(e.p).p7++;
      else if(e.res==='2MIN') get(e.p).p2++;
    }
    if(e.kind==='poss' && e.side===o){ if(e.res==='7M') get(e.opp).r7++; if(e.res==='2MIN') get(e.opp).r2++; }
    if(e.kind==='p7' && e.side===s && e.res==='MB7M') get(e.p).mb++;
    else if(e.kind==='p7' && e.side===s){ const r = get(e.p); r.m7.n++; if(e.res==='GOAL') r.m7.g++; if(SHOT.includes(e.reb)){ r.sh.n++; if(e.reb==='GOAL') r.sh.g++; } if(e.reb==='7M') get(e.rebP).p7++; }
    if(e.kind==='p7' && e.side===o && e.reb==='7M') get(e.rebOpp).r7++;
    if(e.kind==='poss' && e.side===o && TURN.includes(e.res) && e.rec && e.rec!=='none') get(e.rec).rb++;
    if(e.kind==='poss' && e.side===o && FOULS.includes(e.res)) get(e.opp).fc++;
    if(e.kind==='foul' && e.side===s) get(e.p).fc++;
    if(e.kind==='pen2' && e.side===s) get(e.p).r2++;
    if(e.kind==='pen2' && e.side===o) get(e.opp).p2++;
  });
  Object.values(rows).forEach(r=>{
    // weights agreed with the staff (provisional)
    const pos = r.sh.g*1 + r.m7.g*1 + r.p2*1.5 + r.p7*1 + r.rb*1.5 + r.fc*0.5;
    const neg = (r.sh.n-r.sh.g)*1 + (r.m7.n-r.m7.g)*1.5 + r.mb*1.5 + r.r2*1.5 + r.r7*1;
    r.pm = Math.round((pos - neg)*10)/10; r.any = r.sh.n + r.m7.n + r.p2 + r.p7 + r.rb + r.fc + r.mb + r.r2 + r.r7 > 0;
  });
  return rows;
}
function playersHTML(m){
  const ratio = v => v.n ? `${v.g} / ${v.n}` : '', pc = v => v.n ? Math.round(100*v.g/v.n)+'%' : '', z = n => n || '';
  const pmf = v => (v>0?'+':'') + (Number.isInteger(v) ? v : v.toFixed(1));
  const pmCell = r => !r.any ? '<td class="bl"></td>' : `<td class="bl pm ${r.pm>0?'up':r.pm<0?'down':'zero'}">${pmf(r.pm)}</td>`;
  const cells = r => `<td class="bl">${ratio(r.sh)}</td><td class="pc">${pc(r.sh)}</td><td class="bl">${ratio(r.m7)}</td><td class="pc">${pc(r.m7)}</td><td class="bl">${z(r.p2)}</td><td>${z(r.p7)}</td><td class="mb">${z(r.mb)}</td><td class="bl">${z(r.r2)}</td><td>${z(r.r7)}</td><td class="rb">${z(r.rb)}</td><td>${z(r.fc)}</td>${pmCell(r)}`;
  const empty = {sh:{g:0,n:0}, m7:{g:0,n:0}, p2:0, p7:0, mb:0, r2:0, r7:0, rb:0, fc:0, pm:0, any:false};
  const table = s => {
    const T = sideTeam(m,s), rows = computePlayers(m, UI.aHalf, s);

    let body = list.map(p=>`<tr class="${p.gk?'gkr':''}"><td class="pl"><span class="num">${p.num}</span> ${esc(p.name)}${p.gk?' <small>GK</small>':''}</td>${cells(rows[p.id]||empty)}</tr>`).join('');
    if(rows['?']) body += `<tr><td class="pl"><span class="num">?</span> Unknown</td>${cells(rows['?'])}</tr>`;
    const tot = Object.values(rows).reduce((a,r)=>({sh:{g:a.sh.g+r.sh.g,n:a.sh.n+r.sh.n}, m7:{g:a.m7.g+r.m7.g,n:a.m7.n+r.m7.n}, p2:a.p2+r.p2, p7:a.p7+r.p7, mb:a.mb+r.mb, r2:a.r2+r.r2, r7:a.r7+r.r7, rb:a.rb+r.rb, fc:a.fc+r.fc, pm:Math.round((a.pm+r.pm)*10)/10, any:a.any||r.any}), {...empty, sh:{g:0,n:0}, m7:{g:0,n:0}});
    return `<section class="ptab" style="--tc:${esc(T.color)}"><div class="ptab-h">${esc(T.name)}</div><div class="tw"><table class="pt ptbl">
      <thead><tr><th rowspan="2" class="pl">Player</th><th colspan="2" class="bl">Shots (no 7m)</th><th colspan="2" class="bl">7m</th><th colspan="3" class="bl">Attack</th><th colspan="4" class="bl">Defense</th><th rowspan="2" class="bl">+/−</th></tr>
      <tr><th class="bl">Ratio</th><th>%</th><th class="bl">Ratio</th><th>%</th><th class="bl" title="2' provoked">2'</th><th title="7m provoked">7m</th><th title="Missing balls">MB</th><th class="bl" title="2' received">2'</th><th title="7m committed">7m</th><th title="Recovered balls">RB</th><th title="Fouls committed">F</th></tr></thead>
      <tbody>${body}</tbody><tfoot><tr><td class="pl">TOTAL</td>${cells(tot)}</tr></tfoot></table></div></section>`; };
  return `<div class="ptabs">${table('L')}${table('R')}</div>
    <p class="foot-note">+/− (provisional weights). Adds: goal 1 · 7m goal 1 · 2' provoked 1.5 · 7m provoked 1 · recovered ball (RB) 1.5 · foul committed (F) 0.5. Subtracts: missed shot 1 · missed 7m 1.5 · missing ball (MB, MB7m included) 1.5 · 2' received 1.5 · 7m committed 1. Shots include C/C and shots after a 7m rebound.</p>`;
}
/* ===================== setup (page 1) ===================== */
function setupHTML(){
  const live = DB.matches.filter(m=>m.status==='live').reverse(), done = DB.matches.filter(m=>m.status!=='live').reverse();
  const mrow = m => { const sc = score(m);

function parseRoster(txt){
  const out = [], bad = [];
  txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const line = l.split(/\t+/).map(x=>x.trim()).filter(Boolean).join(' ');
    const mm = line.match(/^(\d{1,3})[\s.,;:-]+(.+?)$/);
    if(!mm){ bad.push(l); return; }
    let name = mm[2].replace(/\s+/g,' '), gk = false;
    if(/(\s|^)(GK|POR|BR)$/i.test(name)){ gk = true; name = name.replace(/(\s|^)(GK|POR|BR)$/i,'').trim(); }
    out.push({num:Number(mm[1]), name, gk});
  });
  return {players:out, bad};
}

function editFields(d){
  // which fields an event of this kind/result carries
  if(d.kind==='poss'){
    const f = ['phase','res'];
    if(SHOT.includes(d.res)||TURN.includes(d.res)||d.res==='7M'||d.res==='2MIN') f.push('p');
    if(TURN.includes(d.res)) f.push('rec');
    if(SHOT.includes(d.res)) f.push('zone','gk','passive');
    if(['7M','2MIN',...FOULS].includes(d.res)) f.push('opp');
    if(d.res==='7M' && !isTrans(d.phase)) f.push('zone');
    if(d.res==='SFOUL') f.push('gk');
    if(d.res==='2MIN') f.push('min','sec');
    return f;
  }
  if(d.kind==='p7') return ['res','p','gk', ...(d.res==='SAVE'||d.res==='POST' ? ['reb'] : []), ...(d.reb==='7M' ? ['rebP','rebOpp'] : [])];
  return { pen2:['p','opp','min','sec'], yc:['p','min','sec'], rc:['p','min','sec'], foul:['p'], out3:['p'], pl:['p'], to:['min','sec']}[d.kind] || [];
}
function editModal(M){
  const m = match(), d = M.draft, s = d.side, o = other(s);

  const pl = side => [...sideTeam(m,side).players.slice().sort(byNum).map(p=>[p.id,`#${p.num} ${p.name}${p.active===false?' (former)':''}`]),['?','Unknown']];
  const gks = side => [...sideTeam(m,side).players.filter(p=>p.gk).sort(byNum).map(p=>[p.id,`#${p.num} ${p.name}`]),['','None']];
  const nums = n => Array.from({length:n},(_,i)=>[i,two(i)]);
  const F = editFields(d), out = [sel('half','Half',d.half,[[1,'1st half'],[2,'2nd half']])];
  const pLabel = d.kind==='poss' ? (SHOT.includes(d.res)?'Shooter':TURN.includes(d.res)?'Turnover by':'Provoked by') : d.kind==='p7' ? 'Shooter' : 'Player';
  const oLabel = d.res==='7M' ? 'Committed by' : (d.res==='2MIN' ? 'Sanctioned' : d.kind==='pen2' ? 'Provoked by' : 'Foul by');
  F.forEach(k=>{
    if(k==='phase') out.push(sel('phase','Phase',d.phase,ALL_PH.map(p=>[p,PH_LABEL[p]])));
    if(k==='res'){ const rs = d.kind==='p7' ? ['GOAL','SAVE','POST','OUT','MB7M'] : [...SHOT,'7M','2MIN',...FOULS,...(isTrans(d.phase)?['STOPFB']:[]),...TURN];
      out.push(sel('res','Result',d.res,rs.map(r=>[r,RES_LABEL[r]||r]))); }
    if(k==='p') out.push(sel('p',pLabel,d.p,pl(s)));
    if(k==='opp') out.push(sel('opp',oLabel,d.opp,pl(o)));
    if(k==='zone'){ const zs = isTrans(d.phase) ? ['L','C','R','CCL','CCC','CCR'] : POS_ZONES.map(z=>z[1]); out.push(sel('zone','Zone',d.zone,zs.map(z=>[z,ZONE_LABEL[z]]))); }
    if(k==='gk') out.push(sel('gk','Goalkeeper',d.gk,gks(o)));
    if(k==='passive') out.push(sel('passive','Passive play',d.passive?'1':'',[['','No'],['1','Yes']]));
    if(k==='reb') out.push(sel('reb','Rebound by the shooter',d.reb||'',[['','No rebound'],...SHOT.map(r=>[r,RES_LABEL[r]]),['7M','7m provoked']]));
    if(k==='rebP') out.push(sel('rebP','7m provoked by',d.rebP,pl(s)));
    if(k==='rebOpp') out.push(sel('rebOpp','7m committed by',d.rebOpp,pl(o)));
    if(k==='rec') out.push(sel('rec','Ball won by',d.rec||'none',[...pl(o),['none','No one']]));
    if(k==='min') out.push(sel('min','Minute',d.min,nums(61)));
    if(k==='sec') out.push(sel('sec','Second',d.sec,nums(60)));
  });
  return mShell(`Edit · ${sideTeam(m,s).abbr} · ${KIND_LABEL[d.kind]}`, `<div class="row2">${out.join('')}</div>`,
    `<button class="tb" data-act="log">Back to list</button><button class="tb primary" data-act="save-ev">Save changes</button>`);
}
function cleanEvent(d){
  const keep = new Set(['id','kind','side','half',...editFields(d)]);
  Object.keys(d).forEach(k=>{ if(!keep.has(k)) delete d[k]; });
  if(d.kind==='poss' && SHOT.includes(d.res) && isCC(d.zone)) delete d.gk;
  if(d.kind==='poss' && keep.has('zone')){ const ok = isTrans(d.phase) ? ['L','C','R','CCL','CCC','CCR'] : POS_ZONES.map(z=>z[1]); if(!ok.includes(d.zone)) d.zone = ok[0]; }
  if(!d.passive) delete d.passive;
  ['p','opp','rebP','rebOpp'].forEach(k=>{ if(keep.has(k) && d[k]===undefined) d[k]='?'; });
  ['min','sec'].forEach(k=>{ if(keep.has(k) && d[k]===undefined) d[k]=0; });
  return d;
}

async function wake(){ try{ if(!wl && navigator.wakeLock){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null;}); } }catch(e){} }

function exportFile(obj,name){
  const text = JSON.stringify(obj,null,1);
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
  openModal('export',{text,name});
}
function mergeImport(obj){
  const teams = obj.teams || [], matches = obj.matches || (obj.match ? [obj.match] : []);
  if(!teams.length && !matches.length) throw new Error('This file has no teams or matches.');
  matches.forEach(mt=>{ const i = DB.matches.findIndex(x=>x.id===mt.id); if(i>=0) DB.matches[i]=mt; else DB.matches.push(mt); });
  const used = usedPlayerIds();
  teams.forEach(t=>{
    if(!t || !t.id || !Array.isArray(t.players)) throw new Error('A team in this file is incomplete.');
    t.players.forEach(p=>{ if(p.active===undefined) p.active = true; });
    const i = DB.teams.findIndex(x=>x.id===t.id);
    if(i>=0){ // updating a roster: players used in past matches stay as former players
      const keep = DB.teams[i].players.filter(o=>!t.players.some(n=>n.id===o.id) && used.has(o.id)).map(o=>({...o, active:false}));
      DB.teams[i] = {...t, players:[...t.players, ...keep]};
    } else DB.teams.push(t);
    if(t.own) DB.teams.forEach(x=>{ if(x.id!==t.id) x.own = false; });
  });
  DB = migrate(DB); save(); return {t:teams.length, m:matches.length};
}
function usedPlayerIds(){
  const s = new Set();
  DB.matches.forEach(m=>{ ['L','R'].forEach(k=>{ if(m.activeGk?.[k]) s.add(m.activeGk[k]); }); m.events.forEach(e=>['p','opp','gk'].forEach(k=>{ if(e[k]) s.add(e[k]); })); });
  return s;
}

/* ===================== events ===================== */
document.addEventListener('click', ev=>{
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, v = b.dataset.v, side = b.dataset.side, m = match();
  // any registering tap while looking back at the 1st half brings the bench back to the 2nd half
  if(UI.viewHalf && ['phase','yc','rc','out3','pen2','p7','to','to-del','gk','undo','pl'].includes(act)) UI.viewHalf = null;
  if(act==='scrim'){ if(ev.target===b) closeModal(); return; }
  switch(act){
    case 'phase': startFlow(side,'poss',{phase:v}); break;
    case 'foul': case 'yc': case 'rc': case 'out3': case 'pen2': case 'p7': case 'to': startFlow(side,act); break;
    case 'choose': choose(v); break;
    case 'flow-back': if(UI.flow.i===0) UI.flow=null; else UI.flow.i--; render(); break;
    case 'flow-cancel': UI.flow=null; render(); break;
    case 'sanc': UI.sanc = UI.sanc===side ? null : side; render(); break;
    case 'gk': m.activeGk[side] = v; save(); render(); toast(`${sideTeam(m,side).abbr} goalkeeper in goal: ${pName(m,side,v)}`); break;
    case 'half': { const n = Number(v);
      if(m.half===2){ UI.viewHalf = n===1 ? 1 : null; UI.flow = null; render(); break; }   // looking back at the 1st half, no confirmation
      if(n===2 && !ro(m)) openModal('confirm',{title:'Start the 2nd half?',text:'New actions will be registered in the 2nd half. Maps, timelines and goalkeeper rows start empty; tap 1st half at any time to look back.',ok:'half-go',okLabel:'Start 2nd half',v});
      break; }
    case 'half-go': m.half = Number(v); UI.viewHalf = null; UI.flow=null; save(); closeModal(); render(); toast('2nd half started'); break;
    case 'undo': { if(!m || ro(m) || !m.events.length) break; const e = m.events.pop(); save(); render(); toast(`Undone: ${sideTeam(m,e.side).abbr} · ${describe(m,e)}`); break; }
    case 'log': openModal('log'); break;
    case 'analysis': UI.analysis = true; UI.flow=null; UI.sanc=null; render(); break;
    case 'analysis-close': UI.analysis = false; render(); break;
    case 'ahalf': UI.aHalf = v; render(); break;
    case 'atab': UI.aTab = v; render(); break;
    case 'go-setup': UI.viewHalf=null; UI.view='setup'; UI.flow=null; UI.analysis=false; UI.sanc=null; render(); break;
    case 'open-match': UI.viewHalf=null; UI.matchId = v; UI.view='match'; UI.analysis=false; UI.flow=null; UI.sanc=null; render(); break;
    case 'close-modal': closeModal(); break;
    case 'to-del': { const e = m.events.filter(x=>x.kind==='to' && x.side===side)[Number(v)]; if(!e) break;
      openModal('confirm',{title:'Delete this time-out?',text:`${sideTeam(m,side).name} · time-out ${Number(v)+1}${e.min!=null?' · '+tmStr(e):''}`,ok:'to-del-go',okLabel:'Delete time-out',v:e.id,danger:true}); break; }
    case 'to-del-go': m.events = m.events.filter(e=>e.id!==v); save(); closeModal(); render(); toast('Time-out deleted'); break;
    case 'mv': { const i = m.events.findIndex(e=>e.id===v), j = i + Number(b.dataset.d);
      if(i<0 || j<0 || j>=m.events.length) break; [m.events[i], m.events[j]] = [m.events[j], m.events[i]]; save(); render(); break; }
    case 'pl': startFlow(side,'pl'); break;
    case 'flow-passive': { const sd = UI.flow.side; m.passive = m.passive || {L:false,R:false}; m.passive[sd] = !m.passive[sd]; save(); render(); break; }
    case 'print': printMatch(DB.matches.find(x=>x.id===v)); break;
    case 'squad': openModal('squad',{id: v || UI.matchId}); break;
    case 'sq-toggle': { const mt = DB.matches.find(x=>x.id===UI.modal.id); mt.out = mt.out || {L:[],R:[]};
      const list = mt.out[side] = mt.out[side] || [], i = list.indexOf(v); if(i>=0) list.splice(i,1); else list.push(v);
      if(list.includes(mt.activeGk[side])) mt.activeGk[side] = gkList(mt,side)[0]?.id ?? null;
      if(!mt.activeGk[side]) mt.activeGk[side] = gkList(mt,side)[0]?.id ?? null;
      save(); render(); break; }
    case 'zoom': if(b.closest('.zoom')) break; openModal('zoom',{side, what:v}); break;
    case 'timer-start': m.breakEnd = Date.now() + BREAK_MS; save(); render(); toast("Half-time countdown started · 15'"); break;
    case 'timer-ask': openModal('confirm',{title:'Half-time timer',text:'Do you want to reset the timer?',ok:'timer-stop',okLabel:'Reset timer'}); break;
    case 'timer-stop': m.breakEnd = null; save(); closeModal(); render(); break;
    case 'score': openModal('score',{draft:{...(m.scoreAdj||{L:0,R:0})}}); break;
    case 'sadj': { const d = UI.modal.draft, raw = rawScore(m); const nv = d[side] + Number(v); if(raw[side]+nv >= 0) d[side] = nv; renderModal(); break; }
    case 'sreset': UI.modal.draft = {L:0,R:0}; renderModal(); break;
    case 'ssave': m.scoreAdj = {...UI.modal.draft}; save(); closeModal(); render(); toast('Score saved'); break;
    case 'del-ask': UI.modal.del = v; renderModal(); break;
    case 'del-ev': m.events = m.events.filter(e=>e.id!==v); save(); UI.modal.del=null; render(); toast('Action deleted'); break;
    case 'edit-ev': { const e = m.events.find(e=>e.id===v); openModal('edit',{id:v, draft:{...e}}); break; }
    case 'save-ev': { const i = m.events.findIndex(e=>e.id===UI.modal.id); m.events[i] = cleanEvent(UI.modal.draft); save(); openModal('log'); render(); toast('Action updated'); break; }
    case 'edit-team': openModal('team',{id:v}); break;
    case 'save-team': {
      const name = document.getElementById('t-name').value.trim(), abbr = document.getElementById('t-abbr').value.trim().toUpperCase();
      const {players,bad} = parseRoster(document.getElementById('t-roster').value);
      const err = document.getElementById('t-err');
      if(!name || !abbr){ err.textContent = 'Write a team name and an abbreviation.'; break; }
      if(bad.length){ err.textContent = `These lines could not be read (they must start with a number): ${bad.slice(0,3).join(' | ')}`; break; }
      const key = p => p.num+'|'+p.name.toLowerCase();
      const keys = players.map(key), dup = keys.find((k,i)=>keys.indexOf(k)!==i);
      if(dup){ err.textContent = `This player appears twice: #${dup.split('|')[0]}. Two players can share a number only with different names.`; break; }
      const own = document.getElementById('t-own').checked;
      let t = UI.modal.id ? team(UI.modal.id) : null;
      if(!t){ t = {id:uid(), players:[]}; DB.teams.push(t); }
      const old = t.players || [];
      const next = players.map(np=>{ const ex = old.find(o=>key(o)===key(np)); return {id:ex?ex.id:uid(), num:np.num, name:np.name, gk:np.gk, active:true}; });
      const used = usedPlayerIds();
      old.filter(o=>!next.some(n=>n.id===o.id) && used.has(o.id)).forEach(o=>next.push({...o, active:false}));
      Object.assign(t,{name,abbr,color:document.getElementById('t-color').value,own,players:next});
      if(own) DB.teams.forEach(x=>{ if(x!==t) x.own=false; });
      save(); closeModal(); render(); toast(`Team saved · ${players.length} players`); break; }
    case 'del-team-ask': openModal('confirm',{title:'Delete team?',text:`${team(UI.modal.id)?.name||'This team'} and its roster will be deleted. This cannot be undone.`,ok:'del-team',okLabel:'Delete team',v:UI.modal.id,danger:true}); break;
    case 'del-team': DB.teams = DB.teams.filter(t=>t.id!==v); save(); closeModal(); render(); toast('Team deleted'); break;
    case 'new-match':
      if(!ownTeam()){ openModal('info',{title:'Choose your club first',text:'No team is marked as "Our club". Open your club in Teams, tick "Our club" and save, then create the match.'}); break; }
      if(DB.teams.length<2){ openModal('info',{title:'Add the opponent first',text:'A match needs two teams. Create the opponent in Teams, then create the match.'}); break; }
      openModal('newmatch'); break;
    case 'create-match': {
      const code = document.getElementById('n-code').value.trim().toUpperCase(), h = document.getElementById('n-home').value, a = document.getElementById('n-away').value;
      const date = `${document.getElementById('n-y').value}-${document.getElementById('n-m').value}-${document.getElementById('n-d').value}`;
      const err = document.getElementById('n-err');
      if(!code){ err.textContent = 'Write the match code.'; break; }
      if(h===a){ err.textContent = 'Home and away must be different teams.'; break; }
      if(isNaN(new Date(date+'T12:00:00').getTime()) || new Date(date+'T12:00:00').toISOString().slice(0,10)!==date){ err.textContent = 'That date does not exist. Check the day and month.'; break; }
      const leftId = team(a)?.own ? a : h, rightId = leftId===h ? a : h;
      const mt = {id:uid(), date, code, homeId:h, awayId:a, leftId, rightId, status:'live', half:1, activeGk:{L:null,R:null}, events:[], scoreAdj:{L:0,R:0}, breakEnd:null, created:Date.now()};
      DB.matches.push(mt); UI.matchId = mt.id;
      mt.activeGk.L = gkList(mt,'L')[0]?.id ?? null; mt.activeGk.R = gkList(mt,'R')[0]?.id ?? null;
      save(); UI.view='match'; render(); openModal('squad',{id:mt.id}); break; }
    case 'finish-ask': openModal('confirm',{title:'Finish match?',text:'The match will move to completed matches and become read only. Export a JSON backup afterwards.',ok:'finish',okLabel:'Finish match',v}); break;
    case 'finish': { const mt = DB.matches.find(x=>x.id===v); mt.status='done'; mt.breakEnd=null; save(); closeModal(); render(); toast('Match finished'); break; }
    case 'del-match-ask': { const mt = DB.matches.find(x=>x.id===v);
      openModal('confirm',{title:'Delete match?',text:`${fullCode(mt)} and its ${mt.events.length} actions will be deleted from this tablet. This cannot be undone. Export a JSON backup first if you want to keep it.`,ok:'del-match',okLabel:'Delete match',v,danger:true}); break; }
    case 'del-match': { const mt = DB.matches.find(x=>x.id===v);
      DB.matches = DB.matches.filter(x=>x.id!==v);
      if(mt?.demo) DB.teams = DB.teams.filter(t=>!t.demo || DB.matches.some(x=>x.homeId===t.id||x.awayId===t.id));
      if(UI.matchId===v) UI.matchId = null; save(); closeModal(); render(); toast('Match deleted'); break; }
    case 'export-match': { const mt = DB.matches.find(x=>x.id===v);
      exportFile({format:'benchlive-match', version:2, exported:new Date().toISOString(), teams:[team(mt.homeId),team(mt.awayId)].filter(Boolean), match:mt}, `${fullCode(mt).replace(/[^\w.-]+/g,'_')}.json`); break; }
    case 'export-all': exportFile({format:'benchlive-all', version:2, exported:new Date().toISOString(), settings:DB.settings, teams:DB.teams, matches:DB.matches}, `benchlive-backup-${today()}.json`); break;
    case 'copy-export': { const ta = document.getElementById('x-text');
      try{ navigator.clipboard.writeText(ta.value).then(()=>toast('JSON copied'), ()=>{ ta.select(); toast('Text selected · copy it manually'); }); }catch(e){ ta.select(); } break; }
    case 'share-export': { // Android does not share .json files, so the backup travels as a .txt with the same content
      const f = new File([UI.modal.text], UI.modal.name.replace(/\.json$/,'') + '.txt', {type:'text/plain'});
      navigator.share({files:[f], title:UI.modal.name}).catch(err=>{ if(err && err.name!=='AbortError') toast('Could not open the send menu. The file is in Downloads.'); }); break; }
    case 'import': openModal('import'); break;
    case 'do-import': { const err = document.getElementById('i-err'), txt = document.getElementById('i-text').value.trim();
      try{ const r = mergeImport(JSON.parse(txt)); closeModal(); render(); toast(`Imported ${r.t} teams and ${r.m} matches`); }
      catch(e){ err.textContent = 'Could not import: ' + (e.message||'the text is not valid JSON.'); } break; }
    case 'theme': DB.settings.theme = v; save(); applyTheme(); render(); break;
  }
});
document.addEventListener('change', ev=>{
  const el = ev.target;
  if(el.dataset.edit && UI.modal?.type==='edit'){
    const k = el.dataset.edit, d = UI.modal.draft; let v = el.value;
    if(['half','min','sec'].includes(k)) v = Number(v);
    if(k==='gk') v = v==='' ? null : v;
    if(k==='passive'){ if(v==='1') d.passive = true; else delete d.passive; return; }
    if(k==='reb' && v===''){ delete d.reb; if(k==='res'||k==='phase') renderModal(); return; }
    d[k] = v;
    if(k==='phase'||k==='res'||k==='reb') renderModal();
  }
  if(el.dataset.np!==undefined) updatePreview();
  if(el.id==='i-file' && el.files[0]){ const r = new FileReader(); r.onload = () => { document.getElementById('i-text').value = r.result; }; r.readAsText(el.files[0]); }
});
document.addEventListener('input', ev=>{ if(ev.target.dataset.np!==undefined) updatePreview(); });
function updatePreview(){
  const p = document.getElementById('n-prev'); if(!p) return;
  const c = document.getElementById('n-code').value.trim().toUpperCase();
  p.textContent = `${document.getElementById('n-y').value}-${document.getElementById('n-m').value}-${document.getElementById('n-d').value} ${c||'…'}`;
}

/* ===================== demo seed ===================== */
function seed(){
  const mk = (pre,list) => list.map(([num,name,gk])=>({id:pre+num, num, name, gk:!!gk, active:true}));
  const W = {id:'t_wisla', name:'ORLEN WISŁA PŁOCK', abbr:'PLO', color:'#0a4bb0', own:true, players:
    mk('w',[[1,'VUJOVIC',1],[16,'ALILOVIĆ',1],[7,'ILIC'],[9,'SZITA'],[10,'KRAJEWSKI'],[17,'SUŠNJA'],[22,'REY'],[24,'BJERRE'],[34,'RICHARDSON'],[4,'JANC'],[19,'FAZEKAS']])};
  const Rv = {id:'t_demo_rival', demo:true, name:'DEMO RIVAL', abbr:'RIV', color:'#5b6474', players:
    mk('r',[[1,'Rival 1',1],[12,'Rival 12',1],[3,'Rival 3'],[5,'Rival 5'],[6,'Rival 6'],[8,'Rival 8'],[11,'Rival 11'],[14,'Rival 14'],[15,'Rival 15'],[18,'Rival 18'],[20,'Rival 20'],[23,'Rival 23']])};
  const m = {id:'m_demo', demo:true, date:today(), code:'DEMO.PLO-RIV', homeId:W.id, awayId:Rv.id, leftId:W.id, rightId:Rv.id, status:'live', half:1, activeGk:{L:'w1',R:'r1'}, events:[], scoreAdj:{L:0,R:0}, breakEnd:null, created:Date.now()};
  let a = 20261002; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const T = s => s==='L' ? W : Rv;
  const field = s => T(s).players.filter(p=>!p.gk).map(p=>p.id);
  let side = 'L';
  const push = e => m.events.push({id:uid(), ...e});
  for(const [half,n] of [[1,30],[2,20]]){
    for(let i=0;i<n;i++){
      const r = rnd(), o = other(side);
      const phase = r<.62 ? '6x6' : r<.68 ? '7x6' : r<.74 ? '+1' : r<.79 ? '-1' : pick([...FB_PH,...AG_PH]);
      const q = rnd(); let res;
      if(isTrans(phase)) res = q<.6?'GOAL':q<.72?'SAVE':q<.78?'OUT':q<.86?pick(TURN):q<.93?'FOUL':'STOPFB';
      else res = q<.42?'GOAL':q<.57?'SAVE':q<.61?'POST':q<.64?'OUT':q<.68?'BLOCK':q<.82?pick(TURN):q<.88?'7M':q<.92?'2MIN':q<.97?'FOUL':'SFOUL';
      const e = {kind:'poss', side, half, phase, res};
      if(SHOT.includes(res)){ e.p = pick(field(side)); if(!isTrans(phase) && rnd()<.12) e.passive = true; e.zone = isTrans(phase) ? (rnd()<.1?pick(['CCL','CCC','CCR']):pick(['L','C','R'])) : pick(POS_ZONES)[1]; if(!isCC(e.zone)) e.gk = m.activeGk[o]; }
      else if(TURN.includes(res)){ e.p = pick(field(side)); e.rec = rnd()<.6 ? pick(field(o)) : 'none'; }
      else if(res==='7M'||res==='2MIN'){ e.p = pick(field(side)); e.opp = pick(field(o)); if(res==='7M' && !isTrans(phase)) e.zone = pick(POS_ZONES)[1]; if(res==='2MIN'){ e.min = half===1?8+i%20:32+i%25; e.sec = Math.floor(rnd()*60); } }
      else if(FOULS.includes(res)){ e.opp = pick(field(o)); if(res==='SFOUL') e.gk = m.activeGk[o]; }
      push(e);
      if(res==='7M') push({kind:'p7', side, half, res:rnd()<.72?'GOAL':pick(['SAVE','POST','OUT']), p:pick(field(side)), gk:m.activeGk[o]});
      if(half===1 && i===8) push({kind:'yc', side:'R', half, p:'r5', min:11, sec:20});
      if(half===1 && i===11) push({kind:'yc', side:'L', half, p:'w22', min:14, sec:5});
      if(half===1 && i===14) push({kind:'to', side:'R', half, min:17, sec:42});
      if(half===2 && i===9){ m.activeGk.L = 'w16'; }
      if(half===2 && i===5) push({kind:'pl', side:'L', half, p:'w34'});
      if(half===2 && i===11) push({kind:'to', side:'L', half, min:44, sec:10});
      if(half===2 && [2,7,12].includes(i)) push({kind:'pen2', side:'R', half, p:'r8', opp:pick(field('L')), min:33+i*2, sec:15});
      if(half===2 && i===n-3) push({kind:'out3', side:'L', half, p:'w9'});
      const cont = (['SAVE','POST','BLOCK'].includes(res) && rnd()<.25) || FOULS.includes(res) || res==='STOPFB' || res==='2MIN';
      if(!cont) side = other(side);
    }
    side = 'R';
  }
  m.half = 2;
  return {v:2, settings:{theme:'light'}, teams:[W,Rv], matches:[m]};
}

DB = load();
applyTheme();
{ const live = [...DB.matches].reverse().find(m=>m.status==='live'); if(live) UI.matchId = live.id; else UI.view='setup'; }
